<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="36" fill="white" font-size="20" font-weight="700" text-anchor="middle">赛博瑞 · AI 内容工厂 — 管线架构图 v2</text>
  <text x="600" y="56" fill="#64748b" font-size="10" text-anchor="middle">从每日选题到成品输出 · 数据闭环持续进化</text>

  <!-- ===== PHASE LABELS ===== -->
  <text x="60" y="88" fill="#fbbf24" font-size="10" font-weight="700">起始</text>
  <text x="460" y="88" fill="#60a5fa" font-size="10" font-weight="700">中程</text>
  <text x="920" y="88" fill="#34d399" font-size="10" font-weight="700">结尾</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 1: 每日选题 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="100" width="220" height="130" rx="8" fill="#0f172a"/>
  <rect x="30" y="100" width="220" height="130" rx="8" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="50" y="125" fill="#fbbf24" font-size="13" font-weight="700">① 每日选题</text>
  <text x="50" y="145" fill="#94a3b8" font-size="9">5平台热搜聚合</text>
  <text x="50" y="162" fill="#94a3b8" font-size="9">微博/知乎/百度/抖音/B站</text>
  <text x="50" y="179" fill="#94a3b8" font-size="9">AI筛选 + 多维度评分</text>
  <text x="50" y="196" fill="#94a3b8" font-size="9">HTML看板 + 种子文件</text>
  <rect x="160" y="215" width="80" height="18" rx="4" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="200" y="228" fill="#fbbf24" font-size="8" text-anchor="middle">每日自动运行</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="165" x2="290" y2="165" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 2: 竞品学习 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="300" y="100" width="220" height="130" rx="8" fill="#0f172a"/>
  <rect x="300" y="100" width="220" height="130" rx="8" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="320" y="125" fill="#a78bfa" font-size="13" font-weight="700">② 竞品学习</text>
  <text x="320" y="145" fill="#94a3b8" font-size="9">25条抖音/B站视频分析</text>
  <text x="320" y="162" fill="#94a3b8" font-size="9">转录文本+视觉+音频</text>
  <text x="320" y="179" fill="#94a3b8" font-size="9">深度技术拆解</text>
  <text x="320" y="196" fill="#94a3b8" font-size="9">8份竞品分析报告(.docx)</text>
  <rect x="420" y="215" width="90" height="18" rx="4" fill="rgba(167,139,250,0.2)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="465" y="228" fill="#a78bfa" font-size="8" text-anchor="middle">抖音+ B站双平台</text>

  <!-- Arrow 2→3 -->
  <line x1="520" y1="165" x2="560" y2="165" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 3: Wiki 知识库 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="570" y="100" width="220" height="130" rx="8" fill="#0f172a"/>
  <rect x="570" y="100" width="220" height="130" rx="8" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="590" y="125" fill="#22d3ee" font-size="13" font-weight="700">③ Wiki 知识库</text>
  <text x="590" y="145" fill="#94a3b8" font-size="9">43个wiki页面 · 9个品类</text>
  <text x="590" y="162" fill="#94a3b8" font-size="9">钩子模式·剪辑节奏·BGM</text>
  <text x="590" y="179" fill="#94a3b8" font-size="9">拍摄角度·创作者模式</text>
  <text x="590" y="196" fill="#94a3b8" font-size="9">写作铁律·运镜·灯位</text>
  <rect x="690" y="215" width="90" height="18" rx="4" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="0.6"/>
  <text x="735" y="228" fill="#22d3ee" font-size="8" text-anchor="middle">知识持续积累</text>

  <!-- Arrow 3→4 -->
  <line x1="790" y1="165" x2="830" y2="165" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 4: 文案生成 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="840" y="100" width="330" height="130" rx="8" fill="#0f172a"/>
  <rect x="840" y="100" width="330" height="130" rx="8" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="860" y="125" fill="#60a5fa" font-size="13" font-weight="700">④ 文案生成 ★ 核心</text>
  <text x="860" y="145" fill="#94a3b8" font-size="9">Brief输入 (docx/txt/飞书链接)</text>
  <text x="860" y="162" fill="#94a3b8" font-size="9">DeepSeek + RAG(568 chunks) + Wiki(25000字)</text>
  <text x="860" y="179" fill="#94a3b8" font-size="9">4人设 × 5格式 × 热点挂钩</text>
  <text x="860" y="196" fill="#94a3b8" font-size="9">12项写作铁律 + 抖音短平快</text>
  <rect x="1080" y="215" width="80" height="18" rx="4" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="0.6"/>
  <text x="1120" y="228" fill="#60a5fa" font-size="8" text-anchor="middle">~60秒生成</text>

  <!-- Arrow 4→5 (down then left) -->
  <path d="M 1005 230 L 1005 260 L 600 260 L 600 290" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 5: 质检+修复 (centered below) -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="370" y="295" width="460" height="100" rx="8" fill="#0f172a"/>
  <rect x="370" y="295" width="460" height="100" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="320" fill="#f59e0b" font-size="13" font-weight="700">⑤ 质检 + 修复</text>
  <text x="390" y="340" fill="#94a3b8" font-size="9">12项自动审计：内容质量 / 结构规范 / 合规安全</text>
  <text x="390" y="357" fill="#94a3b8" font-size="9">3轮AutoFix自动修复 · 表演式口语检测 · 违禁词过滤</text>
  <text x="390" y="374" fill="#94a3b8" font-size="9">质量门槛 10/12 · anti-regression · 保底不降级</text>
  <rect x="740" y="370" width="80" height="18" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="780" y="383" fill="#f59e0b" font-size="8" text-anchor="middle">3轮自动修复</text>

  <!-- Arrow 5→6 -->
  <path d="M 600 395 L 600 430" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STAGE 6: 成品输出 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="370" y="440" width="460" height="90" rx="8" fill="#0f172a"/>
  <rect x="370" y="440" width="460" height="90" rx="8" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="465" fill="#34d399" font-size="13" font-weight="700">⑥ 成品输出</text>

  <!-- Output items -->
  <rect x="390" y="478" width="130" height="40" rx="5" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.6"/>
  <text x="455" y="495" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">.docx 口播脚本</text>
  <text x="455" y="510" fill="#64748b" font-size="8" text-anchor="middle">格式化排版成品</text>

  <rect x="535" y="478" width="130" height="40" rx="5" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.6"/>
  <text x="600" y="495" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">.xlsx 分镜表</text>
  <text x="600" y="510" fill="#64748b" font-size="8" text-anchor="middle">10列+灯位SVG嵌入</text>

  <rect x="680" y="478" width="130" height="40" rx="5" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.6"/>
  <text x="745" y="495" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">AI视觉提示词</text>
  <text x="745" y="510" fill="#64748b" font-size="8" text-anchor="middle">Seedance中文格式</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- DATA LOOPS SECTION -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="560" width="1140" height="200" rx="10" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="582" fill="#a78bfa" font-size="12" font-weight="700">数据闭环 — 每次运行都在反哺下一次</text>

  <!-- Loop 1: 竞品→Wiki→生成 -->
  <rect x="50" y="600" width="350" height="65" rx="6" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="70" y="620" fill="#e2e8f0" font-size="11" font-weight="600">闭环一：竞品 → Wiki → 生成</text>
  <text x="70" y="638" fill="#94a3b8" font-size="9">竞品视频分析 → LLM知识蒸馏 → Wiki页面更新</text>
  <text x="70" y="654" fill="#64748b" font-size="9">→ 生成时Wiki注入 → 新竞品数据 → 更新Wiki → 循环</text>

  <!-- Loop 2: 热点→种子→挂钩 -->
  <rect x="425" y="600" width="350" height="65" rx="6" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="445" y="620" fill="#fbbf24" font-size="11" font-weight="600">闭环二：热点 → 种子 → 挂钩</text>
  <text x="445" y="638" fill="#94a3b8" font-size="9">5平台热搜 → AI筛选评分 → topics_seed.txt</text>
  <text x="445" y="654" fill="#64748b" font-size="9">→ meme引擎匹配 → 文案热点挂钩 → 每日更新</text>

  <!-- Loop 3: 审计→修复→回归 -->
  <rect x="800" y="600" width="350" height="65" rx="6" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="820" y="620" fill="#f59e0b" font-size="11" font-weight="600">闭环三：审计 → 修复 → 回归</text>
  <text x="820" y="638" fill="#94a3b8" font-size="9">12项审计 → 失败项分析 → AutoFix修复</text>
  <text x="820" y="654" fill="#64748b" font-size="9">→ 回归检测(不降级) → analytics反哺下次生成</text>

  <!-- Loop arrows connecting the three -->
  <path d="M 400 632 Q 412 632 412 632 L 425 632" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-loop)"/>
  <path d="M 775 632 Q 787 632 787 632 L 800 632" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-loop)"/>

  <!-- Bottom return arrow -->
  <path d="M 600 675 Q 600 710 225 710 Q 50 710 50 680 Q 50 670 50 665" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="560" y="705" fill="#a78bfa" font-size="9">持续反哺</text>

  <!-- Self-learning annotation -->
  <rect x="50" y="720" width="1100" height="30" rx="5" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="0.5"/>
  <text x="70" y="740" fill="#64748b" font-size="9">自学习机制：每次生成 → log.md记录 → 同品类5次 → 自动编译新wiki页面 → 下次生成更精准</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STATS BAR -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="770" width="1140" height="40" rx="6" fill="rgba(30,41,59,0.6)" stroke="#334155" stroke-width="0.5"/>
  <text x="60" y="795" fill="#e2e8f0" font-size="10">25条视频分析</text>
  <text x="200" y="795" fill="#64748b" font-size="10">|</text>
  <text x="220" y="795" fill="#e2e8f0" font-size="10">43个Wiki页面</text>
  <text x="360" y="795" fill="#64748b" font-size="10">|</text>
  <text x="380" y="795" fill="#e2e8f0" font-size="10">8份竞品报告</text>
  <text x="510" y="795" fill="#64748b" font-size="10">|</text>
  <text x="530" y="795" fill="#e2e8f0" font-size="10">9个品类覆盖</text>
  <text x="660" y="795" fill="#64748b" font-size="10">|</text>
  <text x="680" y="795" fill="#e2e8f0" font-size="10">568 chunks</text>
  <text x="790" y="795" fill="#64748b" font-size="10">|</text>
  <text x="810" y="795" fill="#e2e8f0" font-size="10">抖音 + B站 双平台</text>
  <text x="970" y="795" fill="#64748b" font-size="10">|</text>
  <text x="990" y="795" fill="#e2e8f0" font-size="10">5平台热搜</text>
  <text x="1100" y="795" fill="#64748b" font-size="10">|</text>
  <text x="1120" y="795" fill="#e2e8f0" font-size="10">v2.0</text>

  <!-- Pipeline flow annotation at bottom -->
  <text x="600" y="840" fill="#64748b" font-size="10" text-anchor="middle">起始：知道拍什么 → 中程：学会怎么写 → 结尾：交付能用的</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN: Brief injection (vertical annotation on right of stage 4) -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="830" width="260" height="55" rx="6" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="50" y="850" fill="#60a5fa" font-size="10" font-weight="600">Brief 输入方式</text>
  <text x="50" y="868" fill="#94a3b8" font-size="9">① .docx 脚本文件 · ② .txt 纯文本 · ③ 飞书文档链接 · ④ CLI --key-points 参数</text>

  <rect x="310" y="830" width="280" height="55" rx="6" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="330" y="850" fill="#22d3ee" font-size="10" font-weight="600">生成引擎</text>
  <text x="330" y="868" fill="#94a3b8" font-size="9">DeepSeek API + RAG 语义检索 + Wiki 知识注入 + 品类画像 + 数据分析反哺</text>

  <rect x="610" y="830" width="260" height="55" rx="6" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.5"/>
  <text x="630" y="850" fill="#34d399" font-size="10" font-weight="600">成品格式</text>
  <text x="630" y="868" fill="#94a3b8" font-size="9">.docx 口播脚本(宋体) · .xlsx 分镜表(莫兰迪绿) · HTML 选题看板</text>

  <rect x="890" y="830" width="280" height="55" rx="6" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="910" y="850" fill="#a78bfa" font-size="10" font-weight="600">方法论来源</text>
  <text x="910" y="868" fill="#94a3b8" font-size="9">影视飓风(封面前置/AI对齐) · 柱子哥(观点驱动/6维评分)</text>

</svg>
