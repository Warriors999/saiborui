  <text x="165" y="134" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">科普类</text>
  <text x="50" y="170" fill="#94a3b8" font-size="10">目的：建立专业信任</text>
  <text x="50" y="194" fill="#94a3b8" font-size="10">品牌：不提品牌</text>

