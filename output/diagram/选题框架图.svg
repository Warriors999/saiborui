  <!-- Column 1: 科普 -->
  <rect x="30" y="110" width="270" height="340" rx="8" fill="#0f172a"/>
  <rect x="30" y="110" width="270" height="340" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1.5"/>
