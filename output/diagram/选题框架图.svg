  <text x="50" y="256" fill="#e2e8f0" font-size="11">· 磁轴和机械轴到底差在哪</text>
  <text x="50" y="280" fill="#e2e8f0" font-size="11">· 显示器参数扫盲</text>
  <text x="50" y="304" fill="#e2e8f0" font-size="11">· RT、回报率是什么意思</text>

  <rect x="50" y="326" width="230" height="1" fill="#334155"/>
