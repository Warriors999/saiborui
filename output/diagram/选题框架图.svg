  <!-- Title -->
  <text x="600" y="36" fill="white" font-size="22" font-weight="700" text-anchor="middle">选题框架 — 数码账号内容策略</text>
  <text x="600" y="58" fill="#64748b" font-size="11" text-anchor="middle">月更22条 · 周更5条 · 全数码覆盖(笔记本+显示器为主) · 站在用户角度 · 简单实用 · 无广告痕迹</text>

  <!-- ═══════════ FOUR CONTENT TYPES ═══════════ -->
