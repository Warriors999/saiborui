<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="550" y="36" fill="white" font-size="22" font-weight="700" text-anchor="middle">选题闭环系统 — 数据驱动的内容决策</text>
  <text x="550" y="58" fill="#64748b" font-size="11" text-anchor="middle">三个数据源 → 四大内容类型 → 播放反馈 → 持续优化</text>

  <!-- ═══════ TOP: THREE DATA SOURCES ═══════ -->
  <text x="550" y="92" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">三 个 数 据 源</text>

  <!-- Source 1: 选题日报 -->
  <rect x="40" y="112" width="330" height="130" rx="8" fill="#0f172a"/>
  <rect x="40" y="112" width="330" height="130" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="205" y="140" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">每日选题日报</text>
  <text x="205" y="162" fill="#64748b" font-size="10" text-anchor="middle">5平台实时热搜 · AI评分 · 切入角度建议</text>
  <line x1="70" y1="174" x2="340" y2="174" stroke="#334155" stroke-width="0.5"/>
  <text x="70" y="196" fill="#94a3b8" font-size="10">回答：</text>
  <text x="120" y="196" fill="#e2e8f0" font-size="11">"现在数码圈在讨论什么？"</text>
  <text x="70" y="218" fill="#94a3b8" font-size="10">服务：</text>
  <text x="120" y="218" fill="#fbbf24" font-size="11">咨询解读类 + 消费向导时机判断</text>
  <rect x="280" y="228" width="70" height="16" rx="3" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="315" y="240" fill="#fbbf24" font-size="8" text-anchor="middle">每日自动</text>

  <!-- Source 2: 竞品wiki -->
  <rect x="385" y="112" width="330" height="130" rx="8" fill="#0f172a"/>
  <rect x="385" y="112" width="330" height="130" rx="8" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="140" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">竞品学习 Wiki</text>
  <text x="550" y="162" fill="#64748b" font-size="10" text-anchor="middle">25条视频分析 · 43个知识页 · 钩子/结构/节奏</text>
  <line x1="415" y1="174" x2="685" y2="174" stroke="#334155" stroke-width="0.5"/>
  <text x="415" y="196" fill="#94a3b8" font-size="10">回答：</text>
  <text x="465" y="196" fill="#e2e8f0" font-size="11">"同品类最好的内容是怎么做的？"</text>
  <text x="415" y="218" fill="#94a3b8" font-size="10">服务：</text>
  <text x="465" y="218" fill="#a78bfa" font-size="11">科普类 + 干货类 的素材和结构参考</text>
  <rect x="625" y="228" width="70" height="16" rx="3" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="660" y="240" fill="#a78bfa" font-size="8" text-anchor="middle">持续积累</text>

  <!-- Source 3: 播放数据 -->
  <rect x="730" y="112" width="330" height="130" rx="8" fill="#0f172a"/>
  <rect x="730" y="112" width="330" height="130" rx="8" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="895" y="140" fill="#fb7185" font-size="14" font-weight="700" text-anchor="middle">账号播放数据</text>
  <text x="895" y="162" fill="#64748b" font-size="10" text-anchor="middle">31条视频表现 · 5s完播率 · 2s流失率</text>
  <line x1="760" y1="174" x2="1030" y2="174" stroke="#334155" stroke-width="0.5"/>
  <text x="760" y="196" fill="#94a3b8" font-size="10">回答：</text>
  <text x="810" y="196" fill="#e2e8f0" font-size="11">"上次哪种选题效果最好？"</text>
  <text x="760" y="218" fill="#94a3b8" font-size="10">服务：</text>
  <text x="810" y="218" fill="#fb7185" font-size="11">品类优化 + 钩子类型优化 + 发布时机优化</text>
  <rect x="970" y="228" width="70" height="16" rx="3" fill="rgba(251,113,133,0.15)" stroke="#fb7185" stroke-width="0.5"/>
  <text x="1005" y="240" fill="#fb7185" font-size="8" text-anchor="middle">持续反馈</text>

  <!-- Arrows down from sources -->
  <path d="M 205 242 L 205 285" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a-gold)"/>
  <path d="M 550 242 L 550 285" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <path d="M 895 242 L 895 285" stroke="#fb7185" stroke-width="1.5" marker-end="url(#a-rose)"/>

  <!-- ═══════ MIDDLE: CONTENT TYPES ═══════ -->
  <text x="550" y="310" fill="white" font-size="13" font-weight="700" text-anchor="middle">选 题 决 策 — 四 大 内 容 类 型</text>

  <!-- Four type cards -->
  <rect x="40" y="325" width="240" height="150" rx="8" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1"/>
  <text x="160" y="352" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">科普类</text>
  <text x="60" y="376" fill="#94a3b8" font-size="10">建立专业信任 · 不提品牌</text>
  <line x1="60" y1="388" x2="260" y2="388" stroke="#1e293b" stroke-width="0.5"/>
  <text x="60" y="408" fill="#64748b" font-size="9">数据源：</text><text x="120" y="408" fill="#a78bfa" font-size="9">竞品wiki → 同品类内容结构</text>
  <text x="60" y="428" fill="#64748b" font-size="9">选题逻辑：</text><text x="120" y="428" fill="#94a3b8" font-size="9">从竞品成功模式中提取通用话题</text>
  <text x="60" y="448" fill="#64748b" font-size="9">举例：</text><text x="120" y="448" fill="#94a3b8" font-size="9">竞品"磁轴科普"爆了 → 我做"RT精度科普"</text>

  <rect x="295" y="325" width="240" height="150" rx="8" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1"/>
  <text x="415" y="352" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">干货类</text>
  <text x="315" y="376" fill="#94a3b8" font-size="10">实操价值 · 可提品牌做对比</text>
  <line x1="315" y1="388" x2="515" y2="388" stroke="#1e293b" stroke-width="0.5"/>
  <text x="315" y="408" fill="#64748b" font-size="9">数据源：</text><text x="375" y="408" fill="#a78bfa" font-size="9">竞品wiki + 播放数据</text>
  <text x="315" y="428" fill="#64748b" font-size="9">选题逻辑：</text><text x="375" y="428" fill="#94a3b8" font-size="9">参考竞品结构 + 选数据好的品类</text>
  <text x="315" y="448" fill="#64748b" font-size="9">举例：</text><text x="375" y="448" fill="#94a3b8" font-size="9">显示器品类表现好 → 做"千元显示器横评"</text>

  <rect x="550" y="325" width="240" height="150" rx="8" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1"/>
  <text x="670" y="352" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">咨询解读类</text>
  <text x="570" y="376" fill="#94a3b8" font-size="10">热点跟进 · 看情况提品牌</text>
  <line x1="570" y1="388" x2="770" y2="388" stroke="#1e293b" stroke-width="0.5"/>
  <text x="570" y="408" fill="#64748b" font-size="9">数据源：</text><text x="630" y="408" fill="#fbbf24" font-size="9">选题日报 → 实时热搜</text>
  <text x="570" y="428" fill="#64748b" font-size="9">选题逻辑：</text><text x="630" y="428" fill="#94a3b8" font-size="9">热点出现 → 第一时间解读 → 蹭流量</text>
  <text x="570" y="448" fill="#64748b" font-size="9">举例：</text><text x="630" y="448" fill="#94a3b8" font-size="9">COMPUTEX发新卡 → 我当天出解读</text>

  <rect x="805" y="325" width="255" height="150" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="932" y="352" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">消费向导类</text>
  <text x="825" y="376" fill="#94a3b8" font-size="10">促成购买 · 提甲方/推荐 · 无广告痕迹</text>
  <line x1="825" y1="388" x2="1040" y2="388" stroke="#1e293b" stroke-width="0.5"/>
  <text x="825" y="408" fill="#64748b" font-size="9">数据源：</text><text x="885" y="408" fill="#fbbf24" font-size="9">选题日报+促销日历</text>
  <text x="825" y="428" fill="#64748b" font-size="9">选题逻辑：</text><text x="885" y="428" fill="#94a3b8" font-size="9">促销季+用户购买需求 → 推荐产品</text>
  <text x="825" y="448" fill="#64748b" font-size="9">举例：</text><text x="885" y="448" fill="#94a3b8" font-size="9">开学季+笔记本热搜 → "大学新生怎么选电脑"</text>

  <!-- Sourcing arrows -->
  <path d="M 160 252 L 160 323" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 415 252 L 415 323" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 670 242 L 670 323" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 932 242 L 932 323" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 415 252 L 415 323" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══════ FEEDBACK LOOP ═══════ -->
  <text x="550" y="510" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">播 放 反 馈 — 闭 环 优 化</text>

  <!-- Feedback flow -->
  <rect x="40" y="530" width="240" height="60" rx="6" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1"/>
  <text x="160" y="554" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">视频发布后</text>
  <text x="160" y="576" fill="#94a3b8" font-size="10" text-anchor="middle">爬取播放量·5s完播·2s流失</text>

  <text x="300" y="565" fill="#64748b" font-size="16">→</text>

  <rect x="330" y="530" width="240" height="60" rx="6" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1"/>
  <text x="450" y="554" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">数据分析</text>
  <text x="450" y="576" fill="#94a3b8" font-size="10" text-anchor="middle">品类排名·钩子效果·时段分析</text>

  <text x="590" y="565" fill="#64748b" font-size="16">→</text>

  <rect x="620" y="530" width="240" height="60" rx="6" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1"/>
  <text x="740" y="554" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">反馈到下次选题</text>
  <text x="740" y="576" fill="#94a3b8" font-size="10" text-anchor="middle">调整品类配比·优化钩子类型</text>

  <!-- Return arrow -->
  <path d="M 860 560 Q 900 560 900 500 Q 900 450 860 450 Q 660 440 660 395" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#a-rose)"/>
  <text x="905" y="510" fill="#fb7185" font-size="9">优化下次</text>

  <!-- ═══════ BOTTOM: Integration Summary ═══════ -->
  <rect x="40" y="630" width="1020" height="150" rx="10" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>

  <text x="70" y="660" fill="white" font-size="13" font-weight="700">三个数据源如何协同工作</text>

  <!-- Row 1 -->
  <rect x="70" y="680" width="300" height="40" rx="4" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="90" y="705" fill="#fbbf24" font-size="11" font-weight="600">每日选题日报</text>
  <text x="200" y="705" fill="#64748b" font-size="10">→ 告诉你"现在该发什么"，判断进入哪种内容类型</text>

  <!-- Row 2 -->
  <rect x="70" y="728" width="300" height="40" rx="4" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="90" y="753" fill="#a78bfa" font-size="11" font-weight="600">竞品学习 Wiki</text>
  <text x="200" y="753" fill="#64748b" font-size="10">→ 告诉你"最好的内容怎么写"，提供素材和结构</text>

  <!-- Row 3 off to the right -->
  <rect x="430" y="680" width="610" height="88" rx="4" fill="rgba(251,113,133,0.06)" stroke="#fb7185" stroke-width="0.5"/>
  <text x="450" y="705" fill="#fb7185" font-size="11" font-weight="600">账号播放数据</text>
  <text x="560" y="705" fill="#64748b" font-size="10">→ 验证选题效果 → 调整下次配比</text>
  <text x="450" y="728" fill="#94a3b8" font-size="10">例：如果数据说"键盘类视频5s完播率最低"→ 减少干货类键盘选题 → 改为科普类键盘</text>
  <text x="450" y="750" fill="#94a3b8" font-size="10">例：如果"数字锚定式开头"完播率最高 → 后续咨询解读也优先用数字锚定</text>

</svg>
