<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1080">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="550" y="38" fill="white" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle">赛博瑞 · 数据驱动内容工厂 — 起始→中程→结尾 全链路</text>

  <!-- ===== LEFT: Pipeline ===== -->

  <!-- START: 选题 -->
  <rect x="60" y="65" width="500" height="65" rx="8" fill="#0f172a"/>
  <rect x="60" y="65" width="500" height="65" rx="8" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="80" y="90" fill="#fbbf24" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">【起始】① 选题日报</text>
  <text x="80" y="110" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">topic-daily · 13个种子话题 → DeepSeek 6维评分 → Top N推荐 → 柱子哥方法论</text>
  <rect x="490" y="78" width="55" height="20" rx="4" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="517" y="92" fill="#fbbf24" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8" text-anchor="middle">6维评分卡</text>

  <!-- → -->
  <line x1="310" y1="130" x2="310" y2="152" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ② Brief 解析 -->
  <rect x="60" y="158" width="500" height="55" rx="8" fill="#0f172a"/>
  <rect x="60" y="158" width="500" height="55" rx="8" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1"/>
  <text x="80" y="180" fill="#22d3ee" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">② Brief 解析</text>
  <text x="80" y="198" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">卖点提取 · 必带检测 · 封面建议 · 品类识别 · 数据分析反哺</text>
  <rect x="490" y="170" width="55" height="18" rx="3" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="0.6"/>
  <text x="517" y="183" fill="#22d3ee" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8" text-anchor="middle">影视飓风·封面前置</text>

  <line x1="310" y1="213" x2="310" y2="235" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ③ 文案生成 -->
  <rect x="60" y="240" width="500" height="70" rx="8" fill="#0f172a"/>
  <rect x="60" y="240" width="500" height="70" rx="8" fill="rgba(8,51,68,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="80" y="265" fill="#60a5fa" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">【中程】③ AI 文案生成 ★</text>
  <text x="80" y="285" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">RAG检索(568chunks)+Wiki注入 → 4人设×5格式×2模式 → 12铁律 → 抖音禁词过滤</text>
  <text x="80" y="300" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">4人设: 折腾到吐/好设牛啊/朋克/超机懂 | 5格式: review/tierlist/comparison/hkrr/hamd</text>

  <!-- ④ 审核+修复 -->
  <rect x="60" y="320" width="500" height="55" rx="8" fill="#0f172a"/>
  <rect x="60" y="320" width="500" height="55" rx="8" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="80" y="342" fill="#fbbf24" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">④ 15项审核 + auto-fix(≤5轮) + 质量关卡(≥8/11)</text>
  <text x="80" y="360" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">分组: 内容质量/结构节奏/合规检查 · anti-regression · 3视角AI点映团</text>

  <line x1="310" y1="375" x2="310" y2="397" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ⑤ 输出 -->
  <rect x="60" y="403" width="235" height="55" rx="8" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="80" y="425" fill="#34d399" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">⑤ Docx 定稿</text>
  <text x="80" y="443" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">瑞士排版 · 甲方可直接用</text>

  <rect x="325" y="403" width="235" height="55" rx="8" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="345" y="425" fill="#34d399" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">⑥ XLSX分镜 + 灯位SVG</text>
  <text x="345" y="443" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10">默认9列/参考适配/口头描述/秒级预览</text>

  <line x1="177" y1="403" x2="310" y2="403" stroke="#34d399" stroke-width="1" marker-end="url(#arrow-cyan)"/>

  <!-- ===== BOTTOM: Data Loop ===== -->
  <rect x="60" y="478" width="1000" height="185" rx="10" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="80" y="500" fill="#a78bfa" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">【结尾】数据闭环 — 每次生成都在反哺下一次</text>

  <!-- 数据回路卡片 -->
  <rect x="80" y="515" width="220" height="65" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="100" y="535" fill="#e2e8f0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600">评分可视化 Scorecard</text>
  <text x="100" y="555" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">选题6维 · 文案15项 · 分镜14项</text>
  <text x="100" y="570" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8">统一评分卡 + 彩色柱状图</text>

  <rect x="315" y="515" width="220" height="65" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="335" y="535" fill="#e2e8f0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600">Pipeline Analytics</text>
  <text x="335" y="555" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">JSONL事件日志 · 审计闭环</text>
  <text x="335" y="570" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8">改进建议自动注入prompt</text>

  <rect x="550" y="515" width="220" height="65" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="570" y="535" fill="#e2e8f0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600">Analytics Insight</text>
  <text x="570" y="555" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">数据反推文案/剪辑/拍摄</text>
  <text x="570" y="570" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8">高频失败项 → 具体改进建议</text>

  <rect x="785" y="515" width="220" height="65" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="805" y="535" fill="#e2e8f0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="600">人设×品类效能矩阵</text>
  <text x="805" y="555" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">每品类推荐最佳人设</text>
  <text x="805" y="570" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="8">效能分排名 · 数据驱动选择</text>

  <!-- Loop back arrow -->
  <path d="M 550 590 Q 550 640 310 640 Q 60 640 60 610 Q 60 560 60 540" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-cyan)"/>
  <text x="560" y="635" fill="#a78bfa" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">反哺下次生成</text>

  <!-- ===== RIGHT: Methodology ===== -->
  <!-- 影视飓风 -->
  <rect x="620" y="65" width="440" height="180" rx="10" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="88" fill="#22d3ee" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700">方法论: 影视飓风 MediaStorm (160人 · 年营收过亿)</text>
  <text x="640" y="105" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">全域方法论来源 — 封面前置/AI对齐/双轨制/创作框架/节奏公式/点映团</text>

  <!-- 柱子哥 -->
  <rect x="620" y="260" width="440" height="130" rx="10" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="283" fill="#fbbf24" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700">方法论: 柱子哥 TzFilm (个人创作者 · 信息不值钱观点值钱)</text>
  <text x="640" y="300" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">起始选题策略来源 — 每日选题日报/6维评分/观点注入/信息搬运检测</text>

  <!-- ===== BOTTOM: Side pipelines ===== -->
  <rect x="60" y="683" width="310" height="55" rx="8" fill="rgba(59,130,246,0.1)" stroke="#60a5fa" stroke-width="0.6"/>
  <text x="80" y="705" fill="#60a5fa" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600">竞品学习管线</text>
  <text x="80" y="722" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">B站→yt-dlp→Whisper→OpenCV/librosa→LLM→Wiki编译 · 知识复利</text>

  <rect x="385" y="683" width="310" height="55" rx="8" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="0.6"/>
  <text x="405" y="705" fill="#22d3ee" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600">格式适配系统</text>
  <text x="405" y="722" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">默认9列 · --format-ref · --columns · --preview · 灯位SVG全模式</text>

  <rect x="710" y="683" width="350" height="55" rx="8" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.6"/>
  <text x="730" y="705" fill="#34d399" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="10" font-weight="600">新手友好 · 开箱即用</text>
  <text x="730" y="722" fill="#94a3b8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="9">init向导 · quick三步 · 种子数据 · 品类纠错 · CI/CD · 59测试</text>

  <!-- Stats bar -->
  <rect x="60" y="758" width="1000" height="35" rx="6" fill="rgba(30,41,59,0.6)" stroke="#334155" stroke-width="0.5"/>
  <text x="90" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">48模块</text>
  <text x="180" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="200" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">11,252行</text>
  <text x="310" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="330" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">14CLI</text>
  <text x="420" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="440" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">59测试·CI</text>
  <text x="560" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="580" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">52提交</text>
  <text x="670" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="690" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">568chunks·10品类</text>
  <text x="860" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="880" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">起始·中程·结尾</text>
  <text x="1000" y="780" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="10">|</text>
  <text x="1020" y="780" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="10">v1.0.0</text>

