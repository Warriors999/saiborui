<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博瑞 · 控制台</title>
<style>
:root {
  --bg: #0a0a0f; --card: #131318; --border: #1e1e28; --input-bg: #0d0d14;
  --text: #e4e4ec; --dim: #6b6b78; --blue: #3b82f6; --green: #22c55e;
  --amber: #f59e0b; --red: #ef4444; --purple: #8b5cf6; --cyan: #06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;padding:24px;line-height:1.5}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:var(--dim);margin-bottom:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card h2{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.col{flex:1;min-width:200px}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
input,select,textarea{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
select{appearance:none;cursor:pointer}
.cmd-box{background:#000;border:1px solid var(--green);border-radius:8px;padding:14px;font-family:Consolas,monospace;font-size:12px;color:var(--green);word-break:break-all;margin-top:8px;position:relative}
.cmd-box .copy{position:absolute;top:8px;right:8px;background:var(--green);color:#000;border:none;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:700}
.btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{opacity:0.9}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin:2px}
.tag.ok{background:rgba(34,197,94,0.12);color:var(--green)}
.tag.warn{background:rgba(245,158,11,0.12);color:var(--amber)}
.output-preview{background:var(--input-bg);border-radius:8px;padding:16px;max-height:300px;overflow-y:auto;font-size:12px;white-space:pre-wrap;margin-top:12px}
.step-indicator{display:flex;gap:4px;margin-bottom:20px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.step-dot.active{background:var(--green)}
.nav{display:flex;gap:16px;margin-bottom:24px}
.nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:6px 0;border-bottom:2px solid transparent}
.nav a.active,.nav a:hover{color:var(--text);border-bottom-color:var(--blue)}
</style>
</head>
<body>

<div class="nav">
  <a href="dashboard.html">Dashboard</a>
  <a href="console.html" class="active">控制台</a>
</div>

<h1>赛博瑞 · 控制台</h1>
<div class="sub">在线构建命令 · 一键复制到终端执行</div>

<div id="kb-stats" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap"></div>

<div class="grid2">
  <!-- GENERATE SCRIPT -->
  <div class="card">
    <h2>生成文案</h2>
    <div class="row">
      <div class="col"><label>产品名称</label><input id="g-prod" value="网易严选S9Game电竞椅" placeholder="例: 迈从K99键盘"></div>
      <div class="col"><label>品类</label><select id="g-cat"></select></div>
    </div>
    <div class="row">
      <div class="col"><label>人设</label><select id="g-persona"></select></div>
      <div class="col"><label>格式</label><select id="g-format"></select></div>
    </div>
    <div class="row">
      <div class="col"><label>时长(分钟)</label><input id="g-dur" value="2.5" type="number" step="0.5"></div>
      <div class="col"><label>价格</label><input id="g-price" placeholder="例: 1499-1599元"></div>
    </div>
    <div class="row">
      <div class="col"><label>模式</label><select id="g-mode"></select></div>
    </div>
    <label>关键卖点</label><textarea id="g-kp">腰骶联动腰靠满级支撑,8D百变扶手丝滑调节,轿跑级环抱坐感一秒入魂</textarea>
    <button class="btn" onclick="buildGenerate()">构建命令</button>
    <div id="gen-cmd"></div>
  </div>

  <!-- GENERATE STORYBOARD -->
  <div class="card">
    <h2>定稿→分镜</h2>
    <label>脚本文件路径</label><input id="s-path" value="output/scripts/网易严选S9Game电竞椅-折腾到吐.docx">
    <label>产品名称</label><input id="s-prod" value="网易严选S9Game电竞椅">
    <label>人设</label><select id="s-persona"></select>
    <button class="btn" onclick="buildStoryboard()" style="margin-top:12px">构建命令</button>
    <div id="sb-cmd"></div>
  </div>

  <!-- COMPETITIVE -->
  <div class="card">
    <h2>竞品学习</h2>
    <div class="row">
      <div class="col"><label>品类</label><select id="c-cat"></select></div>
      <div class="col"><label>数量</label><select id="c-top"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option></select></div>
    </div>
    <button class="btn" onclick="buildCompetitive()">构建命令</button>
    <div id="comp-cmd"></div>
  </div>

  <!-- AUDIT -->
  <div class="card">
    <h2>审核脚本/分镜</h2>
    <label>文件路径</label><input id="a-path" value="output/scripts/网易严选S9Game电竞椅-折腾到吐.docx">
    <div class="row" style="margin-top:8px">
      <div class="col"><label>时长(分钟)</label><input id="a-dur" value="3.0" type="number" step="0.5"></div>
    </div>
    <button class="btn" onclick="buildAudit()">构建命令</button>
    <div id="audit-cmd"></div>
  </div>
</div>

<script>
// ============================================================
// Embedded app data — mirrors rag_system/cli.py validators
// ============================================================
var APP_DATA = {
  // VALID_CATEGORIES (line 19-22)
  categories: ["desk_chair","gpu","headphone","keyboard","laptop","monitor","mouse","phone","speaker"],

  // VALID_PERSONAS (line 23)
  personas: ["折腾到吐","好设牛啊","朋克","超机懂"],

  // VALID_FORMATS (line 24) with display labels
  formats: [
    {value:"review",     label:"review (评测体)"},
    {value:"tierlist",   label:"tierlist (榜单体)"},
    {value:"comparison", label:"comparison (对比体)"},
    {value:"hkrr",       label:"hkrr (HKRR定位框架)"},
    {value:"hamd",       label:"hamd (HAMD创作法)"}
  ],

  // VALID_MODES (line 25) with display labels
  modes: [
    {value:"normal",       label:"normal (标准)"},
    {value:"experimental", label:"experimental (含思考token)"}
  ]
};

// ============================================================
// Dynamic dropdown population
// ============================================================
function populateSelect(id, items, defaultVal) {
  var sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = '';
  items.forEach(function(item) {
    var opt = document.createElement('option');
    if (typeof item === 'string') {
      opt.value = item;
      opt.textContent = item;
    } else {
      opt.value = item.value;
      opt.textContent = item.label;
    }
    if (opt.value === defaultVal) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ============================================================
// KB Stats — fetch from pre-generated JSON, fallback to embedded data
// ============================================================
function fetchDashboardStats() {
  var el = document.getElementById('kb-stats');

  // Try to read dashboard_data.json (pre-generated by the pipeline)
  fetch('dashboard_data.json')
    .then(function(resp) {
      if (!resp.ok) throw new Error('not found');
      return resp.json();
    })
    .then(function(data) {
      var cats = (data.category_count || (data.categories && data.categories.length) || APP_DATA.categories.length);
      var docs = (data.doc_count || data.total_docs || data.script_count || '—');
      el.innerHTML =
        '<div class="tag ok">KB 品类: ' + cats + '</div>' +
        '<div class="tag ok">KB 文档: ' + docs + '</div>';
    })
    .catch(function() {
      // Fallback: show what we know from embedded data
      el.innerHTML =
        '<div class="tag ok">品类: ' + APP_DATA.categories.length + '</div>' +
        '<div class="tag ok">人设: ' + APP_DATA.personas.length + '</div>' +
        '<div class="tag ok">格式: ' + APP_DATA.formats.length + '</div>' +
        '<div class="tag ok">模式: ' + APP_DATA.modes.length + '</div>';
    });
}

// ============================================================
// Init — populate all dropdowns on page load
// ============================================================
(function init() {
  populateSelect('g-cat',    APP_DATA.categories, 'desk_chair');
  populateSelect('g-persona', APP_DATA.personas,   '折腾到吐');
  populateSelect('g-format',  APP_DATA.formats,    'review');
  populateSelect('g-mode',    APP_DATA.modes,      'normal');
  populateSelect('s-persona', APP_DATA.personas,   '折腾到吐');
  populateSelect('c-cat',    APP_DATA.categories,  'desk_chair');

  fetchDashboardStats();
})();

// ============================================================
// Command builders
// ============================================================
function cmdBox(cmd) {
  return '<div class="cmd-box"><button class="copy" onclick="copy(this,\'' + cmd.replace(/'/g,"\\'") + '\')">复制</button><code>' + cmd + '</code></div>';
}

function copy(btn,text){
  navigator.clipboard.writeText(text);
  btn.textContent='已复制!';setTimeout(function(){btn.textContent='复制'},1500);
}

function buildGenerate(){
  var p  = document.getElementById('g-prod').value;
  var c  = document.getElementById('g-cat').value;
  var pp = document.getElementById('g-persona').value;
  var f  = document.getElementById('g-format').value;
  var d  = document.getElementById('g-dur').value;
  var pr = document.getElementById('g-price').value;
  var m  = document.getElementById('g-mode').value;
  var kp = document.getElementById('g-kp').value.replace(/\n/g,'');
  var cmd = 'python -m rag_system generate --product "' + p + '" --category ' + c + ' --persona "' + pp + '" --key-points "' + kp + '" --duration ' + d + (pr ? ' --price "' + pr + '"' : '') + ' --format ' + f + ' --mode ' + m;
  document.getElementById('gen-cmd').innerHTML = cmdBox(cmd);
}

function buildStoryboard(){
  var p  = document.getElementById('s-path').value;
  var n  = document.getElementById('s-prod').value;
  var pp = document.getElementById('s-persona').value;
  var cmd = 'python -m rag_system generate-storyboard "' + p + '" "' + n + '" "' + pp + '"';
  document.getElementById('sb-cmd').innerHTML = cmdBox(cmd);
}

function buildCompetitive(){
  var c = document.getElementById('c-cat').value;
  var t = document.getElementById('c-top').value;
  var cmd = 'python -m rag_system competitive search --category ' + c + ' --top ' + t;
  document.getElementById('comp-cmd').innerHTML = cmdBox(cmd);
}

function buildAudit(){
  var p = document.getElementById('a-path').value;
  var d = document.getElementById('a-dur').value;
  var cmd = 'python -m rag_system audit --file "' + p + '" --duration ' + d;
  document.getElementById('audit-cmd').innerHTML = cmdBox(cmd);
}
</script>

</body>
</html>
