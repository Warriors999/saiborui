<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

function parseLighting(text) {
  if (!text) return [];
  const parts = text.split('\n').filter(p => p.trim());
  return parts.map(p => {
    const match = p.match(/^([^:：]+)[:：](.+)/);
    return match ? { label: match[1].trim(), value: match[2].trim() } : { label: '', value: p.trim() };
  });
}

function render() {
  const grid = document.getElementById('shotGrid');
  DATA.shots.forEach((s, i) => {
    const isTransition = s.jingbie.includes('转场');
    const card = document.createElement('div');
    card.className = 'shot-card' + (isTransition ? ' transition' : '');
    if (i === 0) card.classList.add('featured');

    const lightingParts = parseLighting(s.lighting);

    card.innerHTML = `
      <div class="card-header">
        <div class="shot-num">${s.num}</div>
        <div class="shot-tags">
          <span class="tag jingbie">${s.jingbie}</span>
          ${s.yunjing ? `<span class="tag yunjing">${s.yunjing}</span>` : ''}
          <span class="tag duration">${s.duration}</span>
          ${s.huazi ? `<span class="huazi-badge">📝 ${s.huazi}</span>` : ''}
          ${s.audio ? `<span class="audio-badge">🔊 ${s.audio}</span>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="visual-desc">${s.desc}</div>
        ${s.vo ? `<div class="vo-line"><div class="vo-label">VO — 口播</div><div class="vo-text">${s.vo}</div></div>` : ''}
      </div>
      <div class="card-footer">
        ${lightingParts.map(l => `<div class="tech-item"><span class="tech-icon">⚡</span><span>${l.label}</span><span class="tech-val">${l.value}</span></div>`).join('')}
      </div>
      ${s.notes ? `<div style="padding:0 18px 10px;"><div class="note-text">${s.notes}</div></div>` : ''}
    `;
    grid.appendChild(card);
  });
}

render();
