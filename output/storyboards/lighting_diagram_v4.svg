<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500">
  <defs>
    <marker id="aK" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="aF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="aC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect width="540" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="270" y="28" fill="#1e293b" font-size="14" font-weight="bold" text-anchor="middle">灯光机位顶视图</text>
  <line x1="30" y1="38" x2="510" y2="38" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Product center -->
  <rect x="220" y="165" width="100" height="80" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="270" y="200" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">产 品</text>
  <text x="270" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">桌面摆放</text>

  <!-- Product front direction (red arrow down) -->
  <line x1="270" y1="245" x2="270" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#aR)"/>
  <text x="290" y="272" fill="#dc2626" font-size="11" font-weight="bold">正面朝向</text>

  <!-- Camera bottom -->
  <circle cx="270" cy="400" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="396" fill="#15803d" font-size="10" font-weight="bold" text-anchor="middle">机位</text>
  <text x="270" y="426" fill="#64748b" font-size="8" text-anchor="middle">50mm F2.8</text>

  <!-- Lens direction (green arrow up) -->
  <line x1="270" y1="382" x2="270" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#aC)"/>
  <text x="290" y="345" fill="#16a34a" font-size="10" font-weight="bold">镜头朝向</text>

  <!-- Camera FOV cone -->
  <line x1="270" y1="382" x2="210" y2="245" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <line x1="270" y1="382" x2="330" y2="245" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>

  <!-- Camera-subject axis -->
  <line x1="270" y1="245" x2="270" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Key light -- right-front 45° -->
  <circle cx="460" cy="120" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="116" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">主 灯</text>
  <text x="460" y="134" fill="#64748b" font-size="8" text-anchor="middle">柔光箱</text>
  <text x="460" y="146" fill="#64748b" font-size="8" text-anchor="middle">5600K</text>
  <!-- Key → product -->
  <line x1="442" y1="130" x2="318" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#aK)"/>
  <text x="400" y="150" fill="#2563eb" font-size="9">45° 右前</text>

  <!-- Fill light -- left side -->
  <circle cx="80" cy="210" r="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="80" y="206" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">辅 灯</text>
  <text x="80" y="226" fill="#94a3b8" font-size="8" text-anchor="middle">左侧补光</text>
  <!-- Fill → product -->
  <line x1="98" y1="210" x2="220" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#aF)"/>

  <!-- Light ratio box -->
  <rect x="30" y="458" width="200" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="130" y="477" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">光比  主灯 : 辅灯 = 2 : 1</text>

  <!-- Distance scale -->
  <line x1="30" y1="443" x2="160" y2="443" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="30" y1="440" x2="30" y2="446" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="160" y1="440" x2="160" y2="446" stroke="#cbd5e1" stroke-width="1"/>
  <text x="95" y="438" fill="#94a3b8" font-size="8" text-anchor="middle">≈ 1.5m</text>

  <!-- Shooting technique -->
  <text x="270" y="477" fill="#64748b" font-size="9" text-anchor="middle">拍摄: 三脚架云台 | 滑轨缓推 | 50mm F2.8</text>
</svg>
